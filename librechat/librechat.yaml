# 对话行为
interface:
  privacyPolicy:
    externalUrl: "https://wanxiangzy.com/pricing"
    openNewTab: true
  termsOfService:
    externalUrl: "https://wanxiangzy.com/pricing"
    openNewTab: true

# 计费：管理员在后台「Balance」面板按模型配置 token 单价；
# 初版先开启余额模式，用户注册后由管理员发放初始余额。
rateLimit:
  fileUploads:
    perMinute: 5
    maxSize: 20
    maxFiles: 6
