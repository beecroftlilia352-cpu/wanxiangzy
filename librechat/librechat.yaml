# LibreChat 配置 —— 万象智艺 AI 对话
# 模型统一走 new.bi 聚合网关（OpenAI 兼容），密钥通过环境变量 NEWBI_API_KEY 注入，
# 不要在本文件写明文密钥。
version: 1.1.6
cache: true

endpoints:
  custom:
    - name: "NewBi"
      apiKey: "${NEWBI_API_KEY}"
      baseURL: "https://api.new.bi/v1"
      models:
        default:
          # 旗舰国际
          - "gpt-5.6-sol"
          - "gpt-5.6-terra"
          - "gpt-5.5"
          - "gpt-5.4-pro"
          - "claude-opus-4-8"
          - "claude-sonnet-4-6"
          - "claude-fable-5"
          # Grok
          - "grok-4.5"
          - "grok-4.3"
          - "grok-4"
          # 推理系列
          - "o3-pro"
          - "o4-mini"
          # 国产旗舰
          - "deepseek-v4-pro"
          - "qwen3.7-max"
          - "glm-4.5"
          - "kimi-k3"
          - "MiniMax-M3"
          - "doubao-seed-2-1-pro-260628"
          # 经济档
          - "gpt-5.4-mini"
          - "gpt-5.4-nano"
          - "deepseek-v4-flash"
          - "glm-4.5-flash"
          - "qwen3.6-27b"
          - "doubao-seed-2-0-lite-260428"
        fetch: false
      titleConvo: true
      titleModel: "gpt-5.4-mini"
      modelDisplayLabel: "New.Bi 聚合模型"
      dropParams:
        - "stop"

modelSpecs:
  list:
    # 国际旗舰
    - name: "gpt-5.6-sol"
      label: "GPT-5.6 Sol · 旗舰"
      group: "旗舰国际"
      groupIcon: "openAI"
      preset:
        endpoint: "NewBi"
        model: "gpt-5.6-sol"
    - name: "gpt-5.6-terra"
      label: "GPT-5.6 Terra · 旗舰"
      group: "旗舰国际"
      groupIcon: "openAI"
      preset:
        endpoint: "NewBi"
        model: "gpt-5.6-terra"
    - name: "gpt-5.5"
      label: "GPT-5.5 · 均衡"
      group: "旗舰国际"
      groupIcon: "openAI"
      preset:
        endpoint: "NewBi"
        model: "gpt-5.5"
    - name: "gpt-5.4-pro"
      label: "GPT-5.4 Pro · 高性价比"
      group: "旗舰国际"
      groupIcon: "openAI"
      preset:
        endpoint: "NewBi"
        model: "gpt-5.4-pro"
    - name: "claude-opus-4-8"
      label: "Claude Opus 4.8 · 深度写作"
      group: "旗舰国际"
      groupIcon: "openAI"
      preset:
        endpoint: "NewBi"
        model: "claude-opus-4-8"
    - name: "claude-sonnet-4-6"
