name: Deploy AWS on tag

on:
  push:
    tags:
      - "*"

concurrency:
  group: aws-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Cache Next.js build cache
        uses: actions/cache@v4
        with:
          path: |
            .next/cache
            node_modules/.cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json', 'next.config.ts') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-

      - name: Normalize SSH target
        env:
          AWS_HOST: ${{ secrets.AWS_HOST }}
          AWS_PORT: ${{ secrets.AWS_PORT }}
          AWS_USER: ${{ secrets.AWS_USER }}
        run: |
          set -euo pipefail
          clean() {
            printf '%s' "$1" | tr -d '\r\n[:space:]'
          }

          HOST="$(clean "${AWS_HOST:-}")"
          USER="$(clean "${AWS_USER:-ec2-user}")"
          PORT="$(clean "${AWS_PORT:-22}")"

          HOST="${HOST#http://}"
          HOST="${HOST#https://}"
          HOST="${HOST%%/*}"

          if [[ "$HOST" == *@* ]]; then
            USER="${HOST%@*}"
            HOST="${HOST#*@}"
          fi

          if [[ -z "$HOST" ]]; then
            echo "::error::AWS_HOST is empty"
            exit 1
          fi

          if [[ ! "$USER" =~ ^[A-Za-z_][A-Za-z0-9._-]*$ ]]; then
            echo "::error::AWS_USER contains invalid characters after normalization"
            exit 1
          fi

          if [[ ! "$PORT" =~ ^[0-9]+$ ]]; then
            echo "::error::AWS_PORT must be a number"
            exit 1
          fi

          {
            echo "AWS_HOST_NORM=$HOST"
            echo "AWS_USER_NORM=$USER"
            echo "AWS_PORT_NORM=$PORT"
          } >> "$GITHUB_ENV"

          echo "SSH target: $USER@$HOST:$PORT"

      - name: Configure SSH
        env:
          AWS_SSH_PRIVATE_KEY: ${{ secrets.AWS_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "${AWS_SSH_PRIVATE_KEY:-}" ]]; then
            echo "::error::AWS_SSH_PRIVATE_KEY is empty"
            exit 1
          fi

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$AWS_SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/aws_deploy_key
          chmod 600 ~/.ssh/aws_deploy_key
          touch ~/.ssh/known_hosts

          for attempt in 1 2 3 4 5; do
            echo "Scanning SSH host key, attempt ${attempt}/5..."
            if ssh-keyscan -T 10 -p "$AWS_PORT_NORM" -H "$AWS_HOST_NORM" >> ~/.ssh/known_hosts 2>/tmp/ssh-keyscan.err; then
              exit 0
            fi
            cat /tmp/ssh-keyscan.err >&2 || true
            sleep 3
          done

          echo "::warning::ssh-keyscan failed; continuing with StrictHostKeyChecking=accept-new"

      - name: Fetch .env.production from EC2
        env:
          AWS_APP_DIR: ${{ secrets.AWS_APP_DIR }}
        run: |
          set -euo pipefail
          BASE_DIR="${AWS_APP_DIR:-$HOME/apps/wanxiangzy}"
          ENV_PATH="$BASE_DIR/shared/.env.production"
          echo "Fetching $ENV_PATH from EC2..."
          scp -P "$AWS_PORT_NORM" -i ~/.ssh/aws_deploy_key \
            -o StrictHostKeyChecking=accept-new \
            -o UserKnownHostsFile=~/.ssh/known_hosts \
            -o ConnectTimeout=60 \
            "$AWS_USER_NORM@$AWS_HOST_NORM:$ENV_PATH" .env.production
          ENV_LINES=$(wc -l < .env.production)
          echo ".env.production loaded (${ENV_LINES} lines)"

      - name: Install dependencies
        run: npm ci

      - name: Run release checks
        run: npm run check:release

      - name: Create deployment archive
        run: |
          set -euo pipefail
          mkdir -p .deploy
          tar \
            --exclude='./.git' \
            --exclude='./.github' \
            --exclude='./.next/cache' \
            --exclude='./.deploy' \
            --exclude='./.ui-check' \
            --exclude='./node_modules' \
            --exclude='./.env.local' \
            --exclude='./.env.production' \
            --exclude='./.api-platform-test-results*.json' \
            --exclude='./.qwen-edits-test-results.json' \
            --exclude='./old-references-contact.jpg' \
            --exclude='./tmp-module-code.txt' \
            --exclude='./*.log' \
            -czf .deploy/app.tar.gz .

      - name: Upload deployment archive
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            echo "Uploading deployment archive, attempt ${attempt}/5..."
            if scp -P "$AWS_PORT_NORM" -i ~/.ssh/aws_deploy_key \
              -o StrictHostKeyChecking=accept-new \
              -o UserKnownHostsFile=~/.ssh/known_hosts \
              -o ConnectTimeout=60 \
              -o ConnectionAttempts=3 \
              -o ServerAliveInterval=30 \
              .deploy/app.tar.gz \
              "$AWS_USER_NORM@$AWS_HOST_NORM:/tmp/wanxiangzy-${GITHUB_RUN_ID}.tar.gz"; then
              exit 0
            fi
            sleep $((attempt * 15))
          done

          echo "::error::Could not upload deployment archive over SSH"
          exit 1

      - name: Update production AI provider env
        env:
          AWS_APP_DIR: ${{ secrets.AWS_APP_DIR }}
          PLATO_BASE_URL: https://yunwu.ai
          PLATO_API_KEY: ${{ secrets.PLATO_API_KEY }}
          PLATO_GPT_IMAGE_MODEL: gpt-image-2
          ANALYZE_LLM_PROVIDER: ${{ vars.ANALYZE_LLM_PROVIDER || 'xiaomi' }}
          YUNWU_API_KEY: ${{ secrets.YUNWU_API_KEY || 'ci-yunwu-key' }}
          YUNWU_API_BASE_URL: https://yunwu.ai
          PRODUCT_RETOUCH_RUNTIME_SKILL_ENABLED: ${{ secrets.PRODUCT_RETOUCH_RUNTIME_SKILL_ENABLED || 'true' }}
        run: |
          set -euo pipefail
          if [[ -z "${PLATO_API_KEY:-}" ]]; then
            echo "::error::PLATO_API_KEY secret is empty"
            exit 1
          fi
          if [[ -z "${YUNWU_API_KEY:-}" ]]; then
            echo "::error::YUNWU_API_KEY secret is empty"
            exit 1
          fi

          quote() { printf '%q' "$1"; }
          REMOTE_ENV="AWS_APP_DIR=$(quote "${AWS_APP_DIR:-}") PLATO_BASE_URL=$(quote "$PLATO_BASE_URL") PLATO_API_KEY=$(quote "$PLATO_API_KEY") PLATO_GPT_IMAGE_MODEL=$(quote "$PLATO_GPT_IMAGE_MODEL") ANALYZE_LLM_PROVIDER=$(quote "$ANALYZE_LLM_PROVIDER") YUNWU_API_KEY=$(quote "$YUNWU_API_KEY") YUNWU_API_BASE_URL=$(quote "$YUNWU_API_BASE_URL") PRODUCT_RETOUCH_RUNTIME_SKILL_ENABLED=$(quote "$PRODUCT_RETOUCH_RUNTIME_SKILL_ENABLED")"

          ssh -p "$AWS_PORT_NORM" -i ~/.ssh/aws_deploy_key \
            -o StrictHostKeyChecking=accept-new \
            -o UserKnownHostsFile=~/.ssh/known_hosts \
            -o ConnectTimeout=60 \
            -o ConnectionAttempts=3 \
            -o ServerAliveInterval=30 \
            "$AWS_USER_NORM@$AWS_HOST_NORM" \
            "$REMOTE_ENV bash -s" <<'REMOTE'
          set -euo pipefail
          BASE_DIR="${AWS_APP_DIR:-$HOME/apps/wanxiangzy}"
          SHARED_DIR="$BASE_DIR/shared"
          ENV_FILE="$SHARED_DIR/.env.production"

          mkdir -p "$SHARED_DIR"
          touch "$ENV_FILE"
          chmod 600 "$ENV_FILE" || true

          escape_sed_replacement() {
            printf '%s' "$1" | sed -e 's/[\/&]/\\&/g'
          }

          set_env_var() {
            local key="$1"
            local value="$2"
            local escaped
            escaped="$(escape_sed_replacement "$value")"
            if grep -q "^${key}=" "$ENV_FILE"; then
              sed -i.bak "s/^${key}=.*/${key}=${escaped}/" "$ENV_FILE"
            else
              printf '%s=%s\n' "$key" "$value" >> "$ENV_FILE"
            fi
          }

          set_env_var PLATO_BASE_URL "$PLATO_BASE_URL"
          set_env_var PLATO_API_KEY "$PLATO_API_KEY"
          set_env_var PLATO_GPT_IMAGE_MODEL "$PLATO_GPT_IMAGE_MODEL"
          set_env_var ANALYZE_LLM_PROVIDER "$ANALYZE_LLM_PROVIDER"
          set_env_var YUNWU_API_KEY "$YUNWU_API_KEY"
          set_env_var YUNWU_API_BASE_URL "$YUNWU_API_BASE_URL"
          set_env_var YUNWU_VISION_MODEL "${YUNWU_VISION_MODEL:-gpt-5.4-nano}"
          set_env_var TRYON_CLOTHING_ANALYZE_BASE_URL "$YUNWU_API_BASE_URL"
          set_env_var TRYON_CLOTHING_ANALYZE_API_KEY "$YUNWU_API_KEY"
          set_env_var PRODUCT_RETOUCH_RUNTIME_SKILL_ENABLED "$PRODUCT_RETOUCH_RUNTIME_SKILL_ENABLED"
          echo "Updated image generation, Yunwu analysis, and product-retouch rollout settings in $ENV_FILE"
          REMOTE

      - name: Deploy on EC2
        env:
          AWS_APP_DIR: ${{ secrets.AWS_APP_DIR }}
          AWS_APP_NAME: ${{ secrets.AWS_APP_NAME }}
          TAG_NAME: ${{ github.ref_name }}
          DEPLOY_ARCHIVE: /tmp/wanxiangzy-${{ github.run_id }}.tar.gz
        run: |
          set -euo pipefail
          quote() { printf '%q' "$1"; }
          REMOTE_ENV="AWS_APP_DIR=$(quote "${AWS_APP_DIR:-}") AWS_APP_NAME=$(quote "${AWS_APP_NAME:-}") TAG_NAME=$(quote "$TAG_NAME") DEPLOY_ARCHIVE=$(quote "$DEPLOY_ARCHIVE")"
          for attempt in 1 2 3 4 5; do
            echo "Starting remote deploy, attempt ${attempt}/5..."
            if ssh -p "$AWS_PORT_NORM" -i ~/.ssh/aws_deploy_key \
              -o StrictHostKeyChecking=accept-new \
              -o UserKnownHostsFile=~/.ssh/known_hosts \
              -o ConnectTimeout=60 \
              -o ConnectionAttempts=3 \
              -o ServerAliveInterval=30 \
              "$AWS_USER_NORM@$AWS_HOST_NORM" \
              "$REMOTE_ENV bash -s" \
              < scripts/deploy-aws-release.sh; then
              exit 0
            fi
            sleep $((attempt * 15))
          done

          echo "::error::Could not start remote deploy over SSH"
          exit 1
