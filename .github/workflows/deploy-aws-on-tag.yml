name: Deploy AWS on tag

on:
  push:
    tags:
      - "*"

concurrency:
  group: aws-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v4

      - name: Create deployment archive
        run: |
          set -euo pipefail
          mkdir -p .deploy
          tar \
            --exclude='./.git' \
            --exclude='./.github' \
            --exclude='./.next' \
            --exclude='./.vercel' \
            --exclude='./.deploy' \
            --exclude='./node_modules' \
            --exclude='./.env.local' \
            --exclude='./.env.production' \
            --exclude='./*.log' \
            -czf .deploy/app.tar.gz .

      - name: Normalize SSH target
        env:
          AWS_HOST: ${{ secrets.AWS_HOST }}
          AWS_PORT: ${{ secrets.AWS_PORT }}
          AWS_USER: ${{ secrets.AWS_USER }}
        run: |
          set -euo pipefail
          clean() {
            printf '%s' "$1" | tr -d '\r\n[:space:]'
          }

          HOST="$(clean "${AWS_HOST:-}")"
          USER="$(clean "${AWS_USER:-ec2-user}")"
          PORT="$(clean "${AWS_PORT:-22}")"

          HOST="${HOST#http://}"
          HOST="${HOST#https://}"
          HOST="${HOST%%/*}"

          if [[ "$HOST" == *@* ]]; then
            USER="${HOST%@*}"
            HOST="${HOST#*@}"
          fi

          if [[ -z "$HOST" ]]; then
            echo "::error::AWS_HOST is empty"
            exit 1
          fi

          if [[ ! "$USER" =~ ^[A-Za-z_][A-Za-z0-9._-]*$ ]]; then
            echo "::error::AWS_USER contains invalid characters after normalization"
            exit 1
          fi

          if [[ ! "$PORT" =~ ^[0-9]+$ ]]; then
            echo "::error::AWS_PORT must be a number"
            exit 1
          fi

          {
            echo "AWS_HOST_NORM=$HOST"
            echo "AWS_USER_NORM=$USER"
            echo "AWS_PORT_NORM=$PORT"
          } >> "$GITHUB_ENV"

          echo "SSH target: $USER@$HOST:$PORT"

      - name: Configure SSH
        env:
          AWS_SSH_PRIVATE_KEY: ${{ secrets.AWS_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "$AWS_SSH_PRIVATE_KEY"
          mkdir -p ~/.ssh
          printf '%s\n' "$AWS_SSH_PRIVATE_KEY" > ~/.ssh/aws_deploy_key
          chmod 600 ~/.ssh/aws_deploy_key
          ssh-keyscan -p "$AWS_PORT_NORM" -H "$AWS_HOST_NORM" >> ~/.ssh/known_hosts

      - name: Upload deployment archive
        run: |
          set -euo pipefail
          scp -P "$AWS_PORT_NORM" -i ~/.ssh/aws_deploy_key .deploy/app.tar.gz \
            "$AWS_USER_NORM@$AWS_HOST_NORM:/tmp/wanxiangzy-${GITHUB_RUN_ID}.tar.gz"

      - name: Deploy on EC2
        env:
          AWS_APP_DIR: ${{ secrets.AWS_APP_DIR }}
          AWS_APP_NAME: ${{ secrets.AWS_APP_NAME }}
          TAG_NAME: ${{ github.ref_name }}
          DEPLOY_ARCHIVE: /tmp/wanxiangzy-${{ github.run_id }}.tar.gz
        run: |
          set -euo pipefail
          quote() { printf '%q' "$1"; }
          REMOTE_ENV="AWS_APP_DIR=$(quote "${AWS_APP_DIR:-}") AWS_APP_NAME=$(quote "${AWS_APP_NAME:-}") TAG_NAME=$(quote "$TAG_NAME") DEPLOY_ARCHIVE=$(quote "$DEPLOY_ARCHIVE")"
          ssh -p "$AWS_PORT_NORM" -i ~/.ssh/aws_deploy_key "$AWS_USER_NORM@$AWS_HOST_NORM" \
            "$REMOTE_ENV bash -s" \
            < scripts/deploy-aws-release.sh
