name: Trigger Vercel deploy hook

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      disable_build_cache:
        description: "Trigger Vercel without build cache"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

concurrency:
  group: vercel-deploy-hook
  cancel-in-progress: true

jobs:
  trigger:
    name: Trigger Vercel
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Trigger deploy hook
        env:
          VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
          DISABLE_BUILD_CACHE: ${{ github.event.inputs.disable_build_cache || 'false' }}
        run: |
          set -euo pipefail

          if [ -z "${VERCEL_DEPLOY_HOOK_URL:-}" ]; then
            echo "::error::Missing repository secret VERCEL_DEPLOY_HOOK_URL"
            exit 1
          fi

          HOOK_URL="$(printf '%s' "$VERCEL_DEPLOY_HOOK_URL" | tr -d '\r\n[:space:]')"
          if [ "$DISABLE_BUILD_CACHE" = "true" ]; then
            if [[ "$HOOK_URL" == *\?* ]]; then
              HOOK_URL="${HOOK_URL}&buildCache=false"
            else
              HOOK_URL="${HOOK_URL}?buildCache=false"
            fi
          fi

          response_file="$(mktemp)"
          http_code="$(
            curl \
              --location \
              --show-error \
              --silent \
              --request POST \
              --output "$response_file" \
              --write-out "%{http_code}" \
              "$HOOK_URL"
          )"

          echo "GitHub SHA: ${GITHUB_SHA}"
          echo "Vercel hook HTTP status: ${http_code}"
          echo "Vercel hook response:"
          cat "$response_file"
          echo

          {
            echo "### Vercel Deploy Hook"
            echo
            echo "- GitHub SHA: \`${GITHUB_SHA}\`"
            echo "- HTTP status: \`${http_code}\`"
            echo
            echo "\`\`\`json"
            cat "$response_file"
            echo
            echo "\`\`\`"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "${http_code#2}" = "$http_code" ]; then
            echo "::error::Vercel deploy hook returned HTTP ${http_code}"
            exit 1
          fi

          echo "Vercel deploy hook triggered for ${GITHUB_SHA}"
