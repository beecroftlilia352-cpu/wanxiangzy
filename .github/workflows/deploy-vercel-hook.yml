name: Deploy Vercel production

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      force:
        description: "Deploy without Vercel build cache"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

concurrency:
  group: vercel-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy Vercel
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Validate Vercel secrets
        run: |
          set -euo pipefail

          if [ -z "${VERCEL_TOKEN:-}" ]; then
            echo "::error::Missing repository secret VERCEL_TOKEN"
            exit 1
          fi

          if [ -z "${VERCEL_ORG_ID:-}" ]; then
            echo "::error::Missing repository secret VERCEL_ORG_ID"
            exit 1
          fi

          if [ -z "${VERCEL_PROJECT_ID:-}" ]; then
            echo "::error::Missing repository secret VERCEL_PROJECT_ID"
            exit 1
          fi

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel production settings
        run: vercel pull --yes --environment=production --token "$VERCEL_TOKEN"

      - name: Validate pulled production env
        run: |
          set -euo pipefail

          env_file=".vercel/.env.production.local"
          if [ ! -f "$env_file" ]; then
            echo "::error::Vercel production env file was not pulled: $env_file"
            exit 1
          fi

          missing=0
          for key in NEXT_PUBLIC_SUPABASE_URL NEXT_PUBLIC_SUPABASE_ANON_KEY; do
            if ! grep -qE "^${key}=.+" "$env_file"; then
              echo "::error::Missing ${key} in Vercel Production Environment Variables"
              missing=1
            else
              echo "${key}=present"
            fi
          done

          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Build Vercel output
        run: |
          set -euo pipefail
          set -a
          . .vercel/.env.production.local
          set +a
          vercel build --prod --token "$VERCEL_TOKEN"

      - name: Deploy to Vercel production
        env:
          FORCE_DEPLOY: ${{ github.event.inputs.force || 'false' }}
        run: |
          set -euo pipefail

          args=(deploy --prebuilt --prod --archive=tgz --token "$VERCEL_TOKEN")
          if [ "$FORCE_DEPLOY" = "true" ]; then
            args+=(--force)
          fi

          deployment_url="$(vercel "${args[@]}")"
          echo "Deployment URL: $deployment_url"

          {
            echo "### Vercel Production Deployment"
            echo
            echo "- GitHub SHA: \`${GITHUB_SHA}\`"
            echo "- Deployment URL: $deployment_url"
          } >> "$GITHUB_STEP_SUMMARY"
